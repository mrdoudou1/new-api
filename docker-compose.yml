version: '3.4'

services:
  new-api:
    image: new-api:rc26-codex-id-compat-20260827-1013
    pull_policy: never
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
    depends_on:
      - redis
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:${PORT:-3000}/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      - new-api-network

volumes: {}

networks:
  new-api-network:
    driver: bridge
